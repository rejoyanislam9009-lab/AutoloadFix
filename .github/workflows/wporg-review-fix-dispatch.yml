name: Dispatch WordPress.org review fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/wporg-review-aulonexa'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/wporg-review-aulonexa
          fetch-depth: 0

      - name: Apply review fixes once
        shell: bash
        run: |
          if [ ! -f autoloadfix.php ]; then
            echo 'Review fix already applied.'
            exit 0
          fi
          python .github/scripts/wporg_review_fix.py

      - name: Commit to review branch when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '[wporg-review-fix] Rename to Aulonexa and publish readable source'
          git push origin HEAD:fix/wporg-review-aulonexa
