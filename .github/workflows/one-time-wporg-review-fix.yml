name: One-time WordPress.org review fix

on:
  push:
    branches: [fix/wporg-review-aulonexa]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review-fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/wporg-review-aulonexa
          fetch-depth: 0

      - name: Apply naming, source and packaging fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          new_slug = 'aulonexa-autoload-diagnostics'

          # Rename the public brand in PHP/JS/docs while leaving lower-case
          # autoloadfix_* data keys, CSS classes and database identifiers intact
          # for compatibility with pre-release test installs.
          for path in list(root.rglob('*.php')) + list(root.rglob('*.js')) + [root/'readme.txt', root/'README.md']:
              if not path.exists() or '.git' in path.parts or '.github' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('AutoloadFix', 'Aulonexa')
              if path.suffix == '.php':
                  text = text.replace("'autoloadfix'", f"'{new_slug}'")
                  text = text.replace('"autoloadfix"', f'"{new_slug}"')
              path.write_text(text, encoding='utf-8')

          # Main plugin header / version / public branding.
          main = root/'autoloadfix.php'
          text = main.read_text(encoding='utf-8')
          text = re.sub(r'^ \* Plugin Name:\s+.*$', ' * Plugin Name:       Aulonexa – Autoload & Cache Diagnostics', text, flags=re.M)
          text = re.sub(r'^ \* Plugin URI:\s+.*\n', '', text, flags=re.M)
          text = re.sub(r'^ \* Description:\s+.*$', ' * Description:       Safely audit autoloaded options, diagnose cache and page performance issues, generate supported optimization profiles, and verify fixes.', text, flags=re.M)
          text = re.sub(r'^ \* Version:\s+.*$', ' * Version:           1.4.1', text, flags=re.M)
          text = re.sub(r'^ \* Author:\s+.*$', ' * Author:            Zenora Labs', text, flags=re.M)
          text = re.sub(r'^ \* Author URI:\s+.*\n', '', text, flags=re.M)
          text = re.sub(r'^ \* Text Domain:\s+.*$', f' * Text Domain:       {new_slug}', text, flags=re.M)
          text = text.replace("define( 'AUTOLOADFIX_VERSION', '1.4.0' );", "define( 'AUTOLOADFIX_VERSION', '1.4.1' );")
          main.write_text(text, encoding='utf-8')

          # Readme metadata, source access, and release note.
          readme = root/'readme.txt'
          text = readme.read_text(encoding='utf-8')
          lines = text.splitlines()
          if lines:
              lines[0] = '=== Aulonexa – Autoload & Cache Diagnostics ==='
          lines = [line for line in lines if not line.startswith('Contributors:')]
          text = '\n'.join(lines) + '\n'
          text = text.replace('Stable tag: 1.4.0', 'Stable tag: 1.4.1')
          text = text.replace('Upload the `autoloadfix` folder', f'Upload the `{new_slug}` folder')
          text = text.replace('wp autoloadfix status', 'wp aulonexa status')
          text = text.replace('wp autoloadfix top', 'wp aulonexa top')
          text = text.replace('wp autoloadfix audit', 'wp aulonexa audit')
          dev = """\n== Development Source ==\n\nThe maintained development source is publicly available at:\nhttps://github.com/rejoyanislam9009-lab/AutoloadFix\n\nAulonexa does not require npm, webpack, or another compile/minification step for its shipped assets. The JavaScript and CSS files included in the plugin are the human-readable source files used at runtime. The GitHub Actions workflow in `.github/workflows/quality.yml` documents the packaging steps used to build the installable ZIP.\n\n"""
          if '== Development Source ==' not in text:
              text = text.replace('== Installation ==\n', dev + '== Installation ==\n')
          changelog = """== Changelog ==\n\n= 1.4.1 =\n* Renamed the plugin to Aulonexa – Autoload & Cache Diagnostics with a distinctive directory identity.\n* Updated the text domain and WordPress.org package slug for the pending directory review.\n* Replaced the compressed advanced admin script with human-readable source.\n* Documented the public development source and packaging process.\n\n"""
          text = text.replace('== Changelog ==\n\n', changelog, 1)
          text = text.replace('= 1.4.0 =\nAdds conservative importable optimization profiles', '= 1.4.1 =\nDirectory-review naming and source-availability compliance update.\n\n= 1.4.0 =\nAdds conservative importable optimization profiles')
          readme.write_text(text, encoding='utf-8')

          # README: make source/build provenance explicit to human reviewers.
          readme_md = root/'README.md'
          md = readme_md.read_text(encoding='utf-8')
          md = md.replace('# Aulonexa', '# Aulonexa – Autoload & Cache Diagnostics', 1)
          source_section = """\n## Development source and build\n\nThis GitHub repository is the maintained public development source for the WordPress.org package. The runtime JavaScript and CSS are committed in human-readable form and no npm, webpack, transpilation, or minification step is required. The distribution ZIP is assembled by `.github/workflows/quality.yml` after PHP lint and WordPress Plugin Check pass.\n\n"""
          if '## Development source and build' not in md:
              md += source_section
          readme_md.write_text(md, encoding='utf-8')

          # Replace compressed advanced.js with readable, modifiable source.
          advanced = root/'assets/js/advanced.js'
          advanced.write_text("""(function () {\n\t'use strict';\n\n\tfunction query(selector, context) {\n\t\treturn (context || document).querySelector(selector);\n\t}\n\n\tfunction queryAll(selector, context) {\n\t\treturn Array.prototype.slice.call((context || document).querySelectorAll(selector));\n\t}\n\n\tfunction filterAdvancedOptions() {\n\t\tvar table = query('#autoloadfix-advanced-table');\n\t\tif (! table) {\n\t\t\treturn;\n\t\t}\n\n\t\tvar searchField = query('#autoloadfix-advanced-search');\n\t\tvar riskField = query('#autoloadfix-advanced-risk');\n\t\tvar watchedField = query('#autoloadfix-advanced-watched');\n\t\tvar search = (searchField.value || '').toLowerCase().trim();\n\t\tvar risk = riskField.value;\n\t\tvar watchedOnly = watchedField.checked;\n\t\tvar shown = 0;\n\n\t\tqueryAll('.autoloadfix-advanced-option', table).forEach(function (row) {\n\t\t\tvar searchable = (row.getAttribute('data-search') || '').toLowerCase();\n\t\t\tvar matchesSearch = ! search || searchable.indexOf(search) !== -1;\n\t\t\tvar matchesRisk = 'all' === risk || row.getAttribute('data-risk') === risk;\n\t\t\tvar matchesWatched = ! watchedOnly || row.getAttribute('data-watched') === '1';\n\t\t\tvar visible = matchesSearch && matchesRisk && matchesWatched;\n\n\t\t\trow.hidden = ! visible;\n\t\t\tif (visible) {\n\t\t\t\tshown++;\n\t\t\t}\n\t\t});\n\n\t\tvar count = query('#autoloadfix-advanced-count');\n\t\tif (count) {\n\t\t\tvar shownLabel = (window.AulonexaAdvanced && window.AulonexaAdvanced.shown) || 'shown';\n\t\t\tcount.textContent = shown + ' ' + shownLabel;\n\t\t}\n\n\t\tvar empty = query('#autoloadfix-advanced-empty');\n\t\tif (empty) {\n\t\t\tempty.hidden = shown !== 0;\n\t\t}\n\t}\n\n\t['autoloadfix-advanced-search', 'autoloadfix-advanced-risk', 'autoloadfix-advanced-watched'].forEach(function (id) {\n\t\tvar field = document.getElementById(id);\n\t\tif (field) {\n\t\t\tfield.addEventListener('autoloadfix-advanced-search' === id ? 'input' : 'change', filterAdvancedOptions);\n\t\t}\n\t});\n\n\tfilterAdvancedOptions();\n\n\tvar copyButton = query('#autoloadfix-advanced-copy');\n\tif (copyButton) {\n\t\tcopyButton.addEventListener('click', function () {\n\t\t\tvar text = copyButton.getAttribute('data-copy') || '';\n\t\t\tif (navigator.clipboard && navigator.clipboard.writeText) {\n\t\t\t\tnavigator.clipboard.writeText(text).then(function () {\n\t\t\t\t\tcopyButton.textContent = (window.AulonexaAdvanced && window.AulonexaAdvanced.copied) || 'Copied';\n\t\t\t\t});\n\t\t\t}\n\t\t});\n\t}\n\n\tif (window.AulonexaAdvanced && window.AulonexaAdvanced.readOnly) {\n\t\tqueryAll('.autoloadfix-disable-button, .autoloadfix-restore-button').forEach(function (button) {\n\t\t\tbutton.disabled = true;\n\t\t\tbutton.classList.add('autoloadfix-readonly-disabled');\n\t\t\tbutton.title = 'Aulonexa read-only mode is enabled';\n\t\t});\n\t}\n}());\n""", encoding='utf-8')

          # CLI keeps a concise command name.
          cli = root/'includes/class-autoloadfix-cli.php'
          cli_text = cli.read_text(encoding='utf-8')
          cli_text = cli_text.replace("WP_CLI::add_command( 'aulonexa-autoload-diagnostics'", "WP_CLI::add_command( 'aulonexa'")
          cli.write_text(cli_text, encoding='utf-8')

          # Packaging must use the requested new WordPress.org slug and exclude
          # repository-only branding / launch-planning assets.
          workflow = root/'.github/workflows/quality.yml'
          wf = workflow.read_text(encoding='utf-8')
          wf = wf.replace('build/autoloadfix', f'build/{new_slug}')
          wf = wf.replace('dist/autoloadfix', f'dist/{new_slug}')
          wf = wf.replace('autoloadfix-1.4.0.zip', f'{new_slug}-1.4.1.zip')
          wf = wf.replace('name: autoloadfix-1.4.0', f'name: {new_slug}-1.4.1')
          wf = wf.replace('path: dist/autoloadfix-1.4.0.zip', f'path: dist/{new_slug}-1.4.1.zip')
          wf = wf.replace("--exclude='README.md' \\", "--exclude='README.md' \\\n            --exclude='WORDPRESS-ORG-LAUNCH-PLAN.md' \\\n            --exclude='branding' \\")
          workflow.write_text(wf, encoding='utf-8')

          distignore = root/'.distignore'
          di = distignore.read_text(encoding='utf-8')
          for item in ['WORDPRESS-ORG-LAUNCH-PLAN.md', 'branding']:
              if item not in di.splitlines():
                  di += item + '\n'
          distignore.write_text(di, encoding='utf-8')

          # Rename the main plugin bootstrap to match the pending directory slug.
          target = root/f'{new_slug}.php'
          target.write_text(main.read_text(encoding='utf-8'), encoding='utf-8')
          main.unlink()
          PY

      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[wporg-review-fix] Rename to Aulonexa and publish readable source'
          git push origin HEAD:fix/wporg-review-aulonexa
