name: Deploy Loadvexa to WordPress.org

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.wordpress-org-deploy-trigger'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy approved 1.4.1 release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SVG renderer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Prepare approved plugin package
        shell: bash
        run: |
          rm -rf build .wordpress-org
          mkdir -p build .wordpress-org
          curl --fail --location --silent --show-error \
            'https://wordpress.org/plugins/files/2026/08/26_16-43-59_loadvexa-autoload-diagnostics.zip' \
            --output /tmp/loadvexa-approved.zip
          unzip -q /tmp/loadvexa-approved.zip -d build
          chmod +x .github/scripts/build-wporg-assets.sh
          .github/scripts/build-wporg-assets.sh .wordpress-org

      - name: Set directory screenshot captions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path('build/loadvexa-autoload-diagnostics/readme.txt')
          text = path.read_text(encoding='utf-8')
          block = "== Screenshots ==\n\n1. Autoload Health Overview - health score, total autoload size, option count, and protected/review classifications.\n2. Monitor & Tools - audit trends, watched options, review workspace, diagnostics, and safety controls.\n3. Cache & Optimization Advisor - detected cache layers, server fit, purge guidance, and verification signals.\n4. Site Problem Scanner - bounded page-by-page scan progress, response timing, cache evidence, and review status.\n5. Optimization Profiles - supported cache-plugin readiness, conservative import guidance, and manual findings.\n\n"
          if '== Screenshots ==' in text:
              text = re.sub(r'== Screenshots ==\n.*?(?=\n== [^=].* ==\n)', block.rstrip() + '\n', text, count=1, flags=re.S)
          else:
              text = text.replace('== Changelog ==', block + '== Changelog ==')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate approved release and assets
        shell: bash
        run: |
          test -f build/loadvexa-autoload-diagnostics/loadvexa-autoload-diagnostics.php
          test -f build/loadvexa-autoload-diagnostics/readme.txt
          grep -q '^ \* Version:[[:space:]]*1\.4\.1$' build/loadvexa-autoload-diagnostics/loadvexa-autoload-diagnostics.php
          grep -qi '^Stable tag:[[:space:]]*1\.4\.1$' build/loadvexa-autoload-diagnostics/readme.txt
          grep -qi '^Contributors:.*wpzenora' build/loadvexa-autoload-diagnostics/readme.txt
          test -f .wordpress-org/icon.svg
          test -f .wordpress-org/icon-128x128.png
          test -f .wordpress-org/icon-256x256.png
          test -f .wordpress-org/banner-772x250.png
          test -f .wordpress-org/banner-1544x500.png
          for n in 1 2 3 4 5; do test -f ".wordpress-org/screenshot-${n}.png"; done

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          generate-zip: true
        env:
          SVN_USERNAME: wpzenora
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: loadvexa-autoload-diagnostics
          VERSION: 1.4.1
          BUILD_DIR: ${{ github.workspace }}/build/loadvexa-autoload-diagnostics
          ASSETS_DIR: .wordpress-org
