name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '8.0', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production tree
        shell: bash
        run: |
          mkdir -p build/autoloadfix
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.distignore' \
            --exclude='README.md' \
            --exclude='build' \
            --exclude='dist' \
            ./ build/autoloadfix/

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: ./build/autoloadfix
          ignore-warnings: true
          ignore-codes: WordPress.WP.I18n.MissingTranslatorsComment

  package:
    name: Build installable ZIP
    runs-on: ubuntu-latest
    needs: [php-lint, plugin-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build distribution
        shell: bash
        run: |
          mkdir -p dist/autoloadfix
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.distignore' \
            --exclude='README.md' \
            --exclude='build' \
            --exclude='dist' \
            ./ dist/autoloadfix/
          cd dist
          zip -r autoloadfix-1.2.0.zip autoloadfix

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: autoloadfix-1.2.0
          path: dist/autoloadfix-1.2.0.zip
          if-no-files-found: error
